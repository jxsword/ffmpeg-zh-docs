# FFmpeg 中文文档翻译术语表（glossary）
# 格式对齐 fmt-zh-docs 惯例：en/zh/status/context/aliases
# status: approved=定稿 / provisional=暂定（评审后转 approved）
# 冻结点：M2 批次 B1 完成后冻结 v1（PLAN §9）；基线 12 条见 R3 修订
# v1 已冻结：2026-11-20（B1 批完成，随批补录 15 条并评审为 approved；
# v2 解冻条件=出现跨批译法冲突或上游 n10 术语变更，届时走 DR 流程）
# B2 批随批补录 4 条（writer/master clock/show mode/side data，
# 2026-11-20 随批评审 approved；沿用 B1"术语表是活文档"约定）
# B3 批随批补录 19 条（宏块/运动矢量/运动估计/运动补偿/码率控制/量化器/
# 量化参数/GOP/操作点/胶片颗粒/错误隐藏/抖动/亮度/色度/帧内刷新/重矩阵化/
# 熵编码/小片/去块，2026-11-21 随批评审 approved）
# B4 批随批补录 12 条（适配集/分片/分段器/入点/出点/变体流/隐藏式字幕/
# 轨道/chunk/一致性窗口/节目流/传输流，2026-11-21 随批评审 approved）
# B5 批随批补录 16 条（套接字/协议处理器/监听/组播/广播/隧道/前向纠错/
# 重传/挂载点/网关/循环缓冲区/百分号编码/交换机/路由键/对等端/延迟，
# 2026-11-21 随批评审 approved）
# B6 批随批补录 11 条（抓取/帧缓冲/设备节点/交叉开关/引脚/双工模式/
# 图文电视/墙钟/预卷/抗锯齿/配置档，2026-11-21 随批评审 approved）
# 原则：muxer=复用器 / demuxer=解复用器（社区主流技术译法，R3 明确）

