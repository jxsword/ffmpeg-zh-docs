site_name: FFmpeg 中文文档
site_description: "FFmpeg 官方文档中文翻译版（基线 n9.0.2，跟随上游 release 增量翻译）"
site_author: "ffmpeg-zh-docs 翻译组"
site_url: "https://jxsword.github.io/ffmpeg-zh-docs/"
repo_url: "https://github.com/jxsword/ffmpeg-zh-docs"
repo_name: "ffmpeg-zh-docs"
edit_uri: "edit/main/zh/"
# DR-006 站点页脚许可声明
copyright: "除 wiki 精选页（CC BY-SA 3.0）外，译文基于 FFmpeg 官方文档（LGPL 2.1+）以 LGPL-2.1-or-later 提供 · 译自 n9.0.2"

# 站点内容目录：翻译文档工作区
docs_dir: zh

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - navigation.instant
    - toc.integrate

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-_,:;.!?，。！？、；：]+'
  - mike:
      version_selector: true
      alias_type: symlink
  - git-revision-date-localized:
      # zh/ 为构建期生成（build_site.py 占位页），git log 不可用——CI 内禁用
      # （strict 模式下 "has no git logs" 告警会中止构建，2026-11-20 实测）
      enabled: false
      type: date
      locale: zh

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
      # CJK 兼容 slug（根级 cjk_slugify.py，对齐 fix_links.page_slug）。
      # B1 实测：默认 markdown.extensions.toc.slugify 为 ASCII-only，
      # 中文标题 slug 变空串，译文页内锚点/跨页锚点全部失效（DR-010）；
      # mkdocs 必须经 python3 -m mkdocs 运行使根级模块可导入；
      # 官方大小写锚点的兼容仍由 fix_links.py + anchor_map 兜底（PLAN §4.1/§4.3）
      slugify: !!python/name:cjk_slugify.slugify

extra:
  version:
    provider: mike
  generator: false
  alternate:
    - name: English (Original)
      link: https://ffmpeg.org/documentation.html
      lang: en

# === NAV-BEGIN（build_site.py 生成，勿手改） ===
